apiVersion: apps/v1
kind: Deployment
metadata:
  name: olive-lifecycle-frontend
  namespace: agrotrack-frontend
  labels:
    app: olive-lifecycle-frontend
    app.kubernetes.io/part-of: agrotrack
    app.kubernetes.io/instance: agrotrack-prod
    app.kubernetes.io/component: frontend
  annotations:
    control-panel.kubernetes.io/display-name: "AgroTrack"
    control-panel.kubernetes.io/description: "Olive lifecycle management for olive farms — field maps, harvests, and farm operations."
    control-panel.kubernetes.io/environment: "Production"
    control-panel.kubernetes.io/icon: "🫒"
    control-panel.kubernetes.io/accent-color: "#63622a"
    control-panel.kubernetes.io/tags: "frontend, react, agriculture, olive"
    control-panel.kubernetes.io/owner: "CaptainBot"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: olive-lifecycle-frontend
  template:
    metadata:
      labels:
        app: olive-lifecycle-frontend
        app.kubernetes.io/part-of: agrotrack
        app.kubernetes.io/instance: agrotrack-prod
        app.kubernetes.io/component: frontend
    spec:
      containers:
      - name: web
        image: PLACEHOLDER_IMAGE_NAME:PLACEHOLDER_IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
