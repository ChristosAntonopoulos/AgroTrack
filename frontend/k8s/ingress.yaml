# In-cluster Ingress for control panel URL discovery. TLS termination is on host Caddy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oleachron-frontend-ingress
  namespace: oleachron-frontend
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - theolivelot.com
        - www.theolivelot.com
        - theolivelot.gr
        - www.theolivelot.gr
      secretName: oleachron-web-tls
  rules:
    - host: theolivelot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: olive-lifecycle-frontend-service
                port:
                  number: 80
    - host: www.theolivelot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: olive-lifecycle-frontend-service
                port:
                  number: 80
    - host: theolivelot.gr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: olive-lifecycle-frontend-service
                port:
                  number: 80
    - host: www.theolivelot.gr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: olive-lifecycle-frontend-service
                port:
                  number: 80
