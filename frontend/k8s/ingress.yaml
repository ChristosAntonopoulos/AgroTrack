# In-cluster Ingress for control panel URL discovery. TLS termination is on host Caddy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oleachron-frontend-ingress
  namespace: oleachron-frontend
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - oleachron.conceptatlas.eu
      secretName: oleachron-web-tls
  rules:
    - host: oleachron.conceptatlas.eu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: olive-lifecycle-frontend-service
                port:
                  number: 80
