server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Raster overlays live on the API. ^~ beats the static-asset regex below.
    location ^~ /uploads/ {
        proxy_pass https://api.oleachron.conceptatlas.eu;
        proxy_ssl_server_name on;
        proxy_set_header Host api.oleachron.conceptatlas.eu;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
        add_header Cache-Control "public";
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Android APK downloads (landing page)
    location /downloads/ {
        types { application/vnd.android.package-archive apk; }
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="theolivelot.apk"';
        add_header Cache-Control "no-cache";
    }

    # Privacy / account-deletion pages must be plain HTML for store reviewers (no SPA shell)
    location = /privacy {
        return 301 /privacy/;
    }
    location ^~ /privacy/ {
        try_files $uri $uri/ /privacy/index.html =404;
        add_header Cache-Control "public, max-age=300";
    }
    location = /delete-account {
        return 301 /delete-account/;
    }
    location ^~ /delete-account/ {
        try_files $uri $uri/ /delete-account/index.html =404;
        add_header Cache-Control "public, max-age=300";
    }

    # Universal / App Links verification (must beat SPA fallback)
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Content-Type "application/json" always;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Content-Type "application/json" always;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Handle React Router - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
