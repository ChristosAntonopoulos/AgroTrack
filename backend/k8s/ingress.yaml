# In-cluster Ingress for control panel URL discovery. TLS termination is on host Caddy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oleachron-api-ingress
  namespace: oleachron-backend
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.theolivelot.com
        - api.theolivelot.gr
      secretName: oleachron-api-tls
  rules:
    - host: api.theolivelot.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: olive-lifecycle-api-service
                port:
                  number: 8080
    - host: api.theolivelot.gr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: olive-lifecycle-api-service
                port:
                  number: 8080
