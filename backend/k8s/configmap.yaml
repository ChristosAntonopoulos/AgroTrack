apiVersion: v1
kind: ConfigMap
metadata:
  name: olive-lifecycle-api-config
  namespace: agrotrack-backend
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  MongoDB__DatabaseName: "OliveLifecycle"
  JWT__Issuer: "OliveLifecycleAPI"
  JWT__Audience: "OliveLifecycleClients"
  JWT__ExpirationMinutes: "60"
  Storage__LocalPath: "uploads"
  Storage__PublicBasePath: "https://api.agrotrack.conceptatlas.eu/uploads"
  Cors__AllowedHost: "agrotrack.conceptatlas.eu"
  Auth__AllowAnonymous: "false"
  DemoAccounts__Seed: "true"
  DemoAccounts__ReseedFarmData: "false"
  Geospatial__Storage__RasterRoot: "geospatial"
  Geospatial__Jobs__Enabled: "true"
  Geospatial__Jobs__WeatherRefreshMinutes: "60"
  Geospatial__Jobs__FireRefreshMinutes: "120"
  Geospatial__Fires__CountryCode: "GRC"
  Geospatial__Satellite__RetentionDays: "400"
  Geospatial__Satellite__MaxRasterDimension: "2048"
