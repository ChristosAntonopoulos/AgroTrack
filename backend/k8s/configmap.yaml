apiVersion: v1
kind: ConfigMap
metadata:
  name: olive-lifecycle-api-config
  namespace: agrotrack-backend
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  MongoDB__DatabaseName: "OliveLifecycle"
  JWT__Issuer: "OliveLifecycleAPI"
  JWT__Audience: "OliveLifecycleClients"
  JWT__ExpirationMinutes: "60"
  Storage__LocalPath: "uploads"
  Storage__PublicBasePath: "/uploads"
  Cors__AllowedHost: "185.193.66.50"
  Auth__AllowAnonymous: "false"
  DemoAccounts__Seed: "true"
  DemoAccounts__ReseedFarmData: "false"
