apiVersion: v1
kind: ConfigMap
metadata:
  name: olive-lifecycle-api-config
  namespace: oleachron-backend
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  MongoDB__DatabaseName: "OliveLifecycle"
  JWT__Issuer: "OliveLifecycleAPI"
  JWT__Audience: "OliveLifecycleClients"
  JWT__ExpirationMinutes: "60"
  Storage__LocalPath: "uploads"
  Storage__PublicBasePath: "https://api.theolivelot.com/uploads"
  Cors__AllowedHost: "theolivelot.com"
  Cors__AllowedOrigins__0: "https://theolivelot.com"
  Cors__AllowedOrigins__1: "https://www.theolivelot.com"
  Cors__AllowedOrigins__2: "https://theolivelot.gr"
  Cors__AllowedOrigins__3: "https://www.theolivelot.gr"
  App__PublicWebBaseUrl: "https://theolivelot.com"
  Email__FromAddress: "hello@theolivelot.com"
  Email__FromName: "The Olive Lot"
  Email__ExposeDevResetLink: "false"
  Feedback__InboxEmail: "hello@theolivelot.com"
  Auth__AllowAnonymous: "false"
  DemoAccounts__Seed: "true"
  DemoAccounts__ReseedFarmData: "false"
  Geospatial__Storage__RasterRoot: "geospatial"
  Geospatial__Jobs__Enabled: "true"
  Geospatial__Jobs__WeatherRefreshMinutes: "60"
  Geospatial__Jobs__FireRefreshMinutes: "120"
  Geospatial__Fires__CountryCode: "GRC"
  Geospatial__Satellite__RetentionDays: "400"
  Geospatial__Satellite__MaxRasterDimension: "2048"
