apiVersion: apps/v1
kind: Deployment
metadata:
  name: olive-lifecycle-api
  namespace: agrotrack-backend
  labels:
    app: olive-lifecycle-api
    app.kubernetes.io/part-of: agrotrack
    app.kubernetes.io/instance: agrotrack-prod
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: olive-lifecycle-api
  template:
    metadata:
      labels:
        app: olive-lifecycle-api
        app.kubernetes.io/part-of: agrotrack
        app.kubernetes.io/instance: agrotrack-prod
        app.kubernetes.io/component: api
    spec:
      containers:
      - name: api
        image: PLACEHOLDER_IMAGE_NAME:PLACEHOLDER_IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: olive-lifecycle-api-config
        env:
        - name: MongoDB__ConnectionString
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: MongoDB__ConnectionString
        - name: JWT__SecretKey
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: JWT__SecretKey
        - name: Geospatial__Fires__MapKey
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: Geospatial__Fires__MapKey
              optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: olive-lifecycle-uploads
