apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: agrotrack-backend
  labels:
    app: olive-lifecycle-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: olive-lifecycle-api
  template:
    metadata:
      labels:
        app: olive-lifecycle-api
    spec:
      containers:
      - name: backend
        image: PLACEHOLDER_IMAGE_NAME:PLACEHOLDER_IMAGE_TAG
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: backend-config
        env:
        - name: MongoDB__ConnectionString
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: MongoDB__ConnectionString
        - name: JWT__SecretKey
          valueFrom:
            secretKeyRef:
              name: backend-secrets
              key: JWT__SecretKey
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: uploads
          mountPath: /app/uploads
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: uploads
        emptyDir: {}
