apiVersion: v1
kind: Service
metadata:
  name: olive-lifecycle-api-service
  namespace: oleachron-backend
  labels:
    app: olive-lifecycle-api
    app.kubernetes.io/part-of: oleachron
  annotations:
    external-dns.alpha.kubernetes.io/hostname: api.oleachron.conceptatlas.eu
spec:
  type: NodePort
  selector:
    app: olive-lifecycle-api
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 31847
    protocol: TCP
    name: http
