# Azure DevOps Build and Deploy Pipeline for Oleachron (Olive Lifecycle Platform)
# Builds Docker images, pushes to Docker Hub, deploys to Kubernetes.
# CI on main: website, API, and Android APK. The APK is staged into the website /downloads.
# Maps use MapLibre Native + free Esri/OSM tiles (no Google API key).

trigger:
  - master
  - main

# Manual run (Pipelines → Run pipeline): check the boxes you want.
# CI on main builds the Android APK and publishes it at /downloads.
parameters:
  - name: deployBackend
    displayName: 'Deploy backend (API)'
    type: boolean
    default: true

  - name: deployFrontend
    displayName: 'Deploy frontend (website)'
    type: boolean
    default: true

  - name: buildMobileApk
    displayName: 'Build and publish Android APK to /downloads'
    type: boolean
    default: true

  - name: deployMobileWeb
    displayName: 'Deploy mobile app as a website'
    type: boolean
    default: true

  # Destructive: drops the OliveLifecycle Mongo database so API seed recreates field-centric demos.
  # Keep false so routine CI does not wipe prod data. Opt in only for a deliberate reseed.
  - name: wipeProductionDatabase
    displayName: 'Wipe production MongoDB (OliveLifecycle) before backend deploy'
    type: boolean
    default: false

variables:
  # Library variable group (Pipelines → Library → Agrotrack-Secrets).
  # Must stay linked or DOCKER_*/JWT_*/MONGODB_* will be empty and docker login breaks.
  - group: Agrotrack-Secrets
  - name: solution
    value: 'backend/OliveLifecycle.sln'
  - name: buildConfiguration
    value: 'Release'
  - name: dockerRegistry
    value: '$(DOCKER_USERNAME)'
  - name: imageName
    value: 'oleachron-backend'
  - name: fullImageName
    value: '$(dockerRegistry)/$(imageName)'
  - name: imageTag
    value: '$(Build.BuildId)'
  - name: dockerfilePath
    value: 'backend/Dockerfile'
  - name: dockerContext
    value: 'backend'
  - name: backendNamespace
    value: 'oleachron-backend'
  - name: frontendNamespace
    value: 'oleachron-frontend'
  - name: backendNodePort
    value: '31847'
  - name: frontendNodePort
    value: '31848'
  - name: backendApiUrl
    value: 'https://api.theolivelot.com'
  - name: frontendBaseUrl
    value: 'https://theolivelot.com'
  - name: kubernetesNodeIp
    value: '185.193.66.50'
  - name: frontendImageName
    value: 'oleachron-frontend'
  - name: fullFrontendImageName
    value: '$(dockerRegistry)/$(frontendImageName)'
  - name: frontendDockerfilePath
    value: 'frontend/Dockerfile'
  - name: frontendDockerContext
    value: 'frontend'
  - name: mobileWebNamespace
    value: 'oleachron-mobile'
  - name: mobileWebNodePort
    value: '31849'
  - name: mobileWebHost
    value: 'theolivelot-mobile.conceptatlas.eu'
  - name: mobileWebBaseUrl
    value: 'https://theolivelot-mobile.conceptatlas.eu'
  - name: mobileWebImageName
    value: 'oleachron-mobile-web'
  - name: fullMobileWebImageName
    value: '$(dockerRegistry)/$(mobileWebImageName)'
  - name: mobileWebDockerfilePath
    value: 'mobile/Dockerfile'
  - name: mobileWebDockerContext
    value: 'mobile'
  - name: apkFilename
    value: 'theolivelot.apk'
  # Self-hosted agent has Docker but no buildx. Classic builder only.
  - name: DOCKER_BUILDKIT
    value: '0'

stages:
# Lean loop: Docker build + deploy only. Re-enable Build/HealthCheck for real production.
# - stage: Build
#   displayName: 'Build and Test'
#   ... UseDotNet, restore, build, test ...

- stage: Package
  displayName: 'Package Application'
  dependsOn: []
  jobs:
  - job: Package
    displayName: 'Create and Push Docker Images'
    pool:
      name: 'Default'
    steps:
    - script: |
        if [ -z "${DOCKER_USERNAME:-}" ] || [ -z "${DOCKER_PASSWORD:-}" ]; then
          echo "ERROR: DOCKER_USERNAME / DOCKER_PASSWORD are empty."
          echo "Link Library variable group 'Agrotrack-Secrets' to this pipeline (YAML: variables.group)."
          exit 1
        fi
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      displayName: 'Login to Docker Hub'
      env:
        DOCKER_USERNAME: $(DOCKER_USERNAME)
        DOCKER_PASSWORD: $(DOCKER_PASSWORD)

    - script: |
        set -euo pipefail
        docker build -t $(fullImageName):$(imageTag) -t $(fullImageName):latest -f $(dockerfilePath) $(dockerContext)
        docker push $(fullImageName):$(imageTag)
        docker push $(fullImageName):latest
        echo "Pushed $(fullImageName):$(imageTag)"
      displayName: 'Build and push backend image'
      condition: eq('${{ parameters.deployBackend }}', true)
      env:
        DOCKER_BUILDKIT: '0'

# APK only. Frontend image is built in FrontendImage after this (so Deploy cannot
# race ahead of a missing botsystem13/oleachron-frontend:$(Build.BuildId) tag).
- stage: MobileBuild
  displayName: 'Build Mobile APK (Gradle, no EAS)'
  dependsOn: []
  condition: and(succeeded(), eq('${{ parameters.buildMobileApk }}', true), not(contains(variables['Build.SourceVersionMessage'], '[skip apk]')))
  jobs:
  - job: BuildMobile
    displayName: 'Build Android APK (Gradle on agent)'
    pool:
      name: 'Default'
    steps:
    - task: NodeTool@0
      displayName: 'Use Node.js 20'
      inputs:
        versionSpec: '20.x'

    - task: Cache@2
      displayName: 'Cache mobile npm packages'
      inputs:
        key: 'npm | "$(Agent.OS)" | mobile/package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(Build.SourcesDirectory)/mobile/node_modules

    - script: 'cd mobile && npm install --prefer-offline --no-audit --no-fund'
      displayName: 'Install mobile dependencies'

    - script: |
        set -euo pipefail
        # Do NOT re-run only part of this step — build + stage must run together.
        chmod +x mobile/scripts/setup-java.sh mobile/scripts/setup-android-sdk.sh \
          mobile/scripts/build-android-apk.sh mobile/scripts/build-and-stage-apk.sh
        source mobile/scripts/setup-java.sh
        echo "##vso[task.setvariable variable=JAVA_HOME]${JAVA_HOME}"
        mobile/scripts/build-and-stage-apk.sh
        test -f mobile/theolivelot.apk
        test -f frontend/public/downloads/$(apkFilename)
      displayName: 'Build and stage APK for frontend /downloads'
      env:
        BACKEND_API_URL: $(backendApiUrl)
        BUILD_BUILDID: $(Build.BuildId)
        BUILD_ID: $(Build.BuildId)
        BUILD_SOURCESDIRECTORY: $(Build.SourcesDirectory)
        APK_FILENAME: $(apkFilename)
        GOOGLE_WEB_CLIENT_ID: $(GOOGLE_WEB_CLIENT_ID)
        GOOGLE_ANDROID_CLIENT_ID: $(GOOGLE_ANDROID_CLIENT_ID)
        GOOGLE_IOS_CLIENT_ID: $(GOOGLE_IOS_CLIENT_ID)
      continueOnError: false
      timeoutInMinutes: 90

    - task: PublishBuildArtifacts@1
      displayName: 'Publish APK as artifact'
      condition: succeeded()
      inputs:
        pathToPublish: 'mobile/theolivelot.apk'
        artifactName: 'mobile-apk'
        publishLocation: 'Container'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish staged frontend downloads (APK + manifest)'
      condition: succeeded()
      inputs:
        pathToPublish: 'frontend/public/downloads'
        artifactName: 'frontend-downloads'
        publishLocation: 'Container'

    - script: |
        echo "=== Mobile Build Summary ==="
        echo ""
        echo "APK built on agent (Gradle, no EAS)."
        echo ""
        echo "Latest:  /downloads/$(apkFilename)"
        echo "Manifest: /downloads/latest.json"
        echo "Landing page section: /#alpha-apk"
        echo ""
        echo "Azure DevOps artifact: Pipelines -> Latest run -> Artifacts -> mobile-apk"
        echo ""
        echo "The app connects to: $(backendApiUrl)"
      displayName: 'Display build summary'

# Single place that pushes oleachron-frontend:$(Build.BuildId). Deploy waits on this.
- stage: FrontendImage
  displayName: 'Build and push frontend image'
  dependsOn:
    - MobileBuild
  condition: and(
      eq('${{ parameters.deployFrontend }}', true),
      in(dependencies.MobileBuild.result, 'Succeeded', 'Skipped')
    )
  jobs:
  - job: PushFrontend
    displayName: 'Build and push frontend Docker image'
    pool:
      name: 'Default'
    steps:
    - checkout: self
      displayName: 'Checkout frontend sources'

    - task: DownloadBuildArtifacts@1
      displayName: 'Download staged APK into frontend/public/downloads'
      condition: and(eq('${{ parameters.buildMobileApk }}', true), not(contains(variables['Build.SourceVersionMessage'], '[skip apk]')))
      inputs:
        buildType: 'current'
        artifactName: 'frontend-downloads'
        downloadPath: '$(Build.SourcesDirectory)/frontend/public'

    - script: |
        set -euo pipefail
        DEST="$(Build.SourcesDirectory)/frontend/public/downloads"
        SRC="$(Build.SourcesDirectory)/frontend/public/frontend-downloads"
        mkdir -p "$DEST"
        if [ -d "$SRC" ]; then
          cp -a "$SRC"/. "$DEST"/
          echo "Copied staged downloads from MobileBuild artifact:"
          ls -lah "$DEST"
        else
          echo "No MobileBuild downloads artifact (APK build skipped) — frontend image without new APK."
        fi
      displayName: 'Normalize downloads into frontend/public/downloads'
      condition: always()

    - script: |
        set -euo pipefail
        if [ -z "${DOCKER_USERNAME:-}" ] || [ -z "${DOCKER_PASSWORD:-}" ]; then
          echo "ERROR: DOCKER_USERNAME / DOCKER_PASSWORD are empty."
          echo "Link Library variable group 'Agrotrack-Secrets' to this pipeline (YAML: variables.group)."
          exit 1
        fi
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      displayName: 'Login to Docker Hub'
      env:
        DOCKER_USERNAME: $(DOCKER_USERNAME)
        DOCKER_PASSWORD: $(DOCKER_PASSWORD)

    - script: |
        set -euo pipefail
        IMAGE="$(fullFrontendImageName):$(imageTag)"
        # Blank a value that still looks like an unexpanded pipeline macro.
        # Do not compare against a macro token here: the preprocessor replaces
        # those before bash runs, and a real secret would be wiped.
        sanitize() {
          local value="${1:-}"
          case "$value" in
            '$('*')')
              value=
              ;;
          esac
          printf '%s' "${value}"
        }
        GOOGLE_WEB_CLIENT_ID_VALUE="$(sanitize "${GOOGLE_WEB_CLIENT_ID:-}")"
        echo "Building $IMAGE ..."
        docker build \
          -t "$IMAGE" \
          -t $(fullFrontendImageName):latest \
          --build-arg REACT_APP_API_URL=$(backendApiUrl) \
          --build-arg REACT_APP_SHOW_DEMO_LOGIN=true \
          --build-arg REACT_APP_GOOGLE_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID_VALUE}" \
          -f $(frontendDockerfilePath) $(frontendDockerContext)
        docker push "$IMAGE"
        docker push $(fullFrontendImageName):latest
        echo "Pushed $IMAGE"
      displayName: 'Build and push frontend image'
      env:
        DOCKER_BUILDKIT: '0'
        GOOGLE_WEB_CLIENT_ID: $(GOOGLE_WEB_CLIENT_ID)

    - script: |
        set -euo pipefail
        IMAGE="$(fullFrontendImageName):$(imageTag)"
        TAG="$(imageTag)"
        REPO="$(frontendImageName)"
        USER="$(dockerRegistry)"
        echo "Verifying Docker Hub has $IMAGE ..."
        # Public Hub API — avoids docker manifest auth quirks on the agent.
        CODE=$(curl -s -o /tmp/hub-tag.json -w "%{http_code}" \
          "https://hub.docker.com/v2/repositories/${USER}/${REPO}/tags/${TAG}/")
        if [ "$CODE" != "200" ]; then
          echo "ERROR: Docker Hub returned HTTP $CODE for ${USER}/${REPO}:${TAG}"
          cat /tmp/hub-tag.json || true
          echo "Frontend push did not land; refusing to continue to Deploy."
          exit 1
        fi
        echo "Confirmed on Docker Hub: $IMAGE"
      displayName: 'Verify frontend tag on Docker Hub'

# Static Expo web export. Independent of the Android APK.
- stage: MobileWebImage
  displayName: 'Build and push mobile web image'
  dependsOn: []
  condition: eq('${{ parameters.deployMobileWeb }}', true)
  jobs:
  - job: PushMobileWeb
    displayName: 'Build and push mobile web Docker image'
    pool:
      name: 'Default'
    steps:
    - checkout: self
      displayName: 'Checkout mobile sources'

    - script: |
        set -euo pipefail
        if [ -z "${DOCKER_USERNAME:-}" ] || [ -z "${DOCKER_PASSWORD:-}" ]; then
          echo "ERROR: DOCKER_USERNAME / DOCKER_PASSWORD are empty."
          echo "Link Library variable group 'Agrotrack-Secrets' to this pipeline (YAML: variables.group)."
          exit 1
        fi
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      displayName: 'Login to Docker Hub'
      env:
        DOCKER_USERNAME: $(DOCKER_USERNAME)
        DOCKER_PASSWORD: $(DOCKER_PASSWORD)

    - script: |
        set -euo pipefail
        IMAGE="$(fullMobileWebImageName):$(imageTag)"
        # Blank a value that still looks like an unexpanded pipeline macro.
        # Do not compare against a macro token here: the preprocessor replaces
        # those before bash runs, and a real secret would be wiped.
        sanitize() {
          local value="${1:-}"
          case "$value" in
            '$('*')')
              value=
              ;;
          esac
          printf '%s' "${value}"
        }
        GOOGLE_WEB_CLIENT_ID_VALUE="$(sanitize "${GOOGLE_WEB_CLIENT_ID:-}")"
        GOOGLE_ANDROID_CLIENT_ID_VALUE="$(sanitize "${GOOGLE_ANDROID_CLIENT_ID:-}")"
        GOOGLE_IOS_CLIENT_ID_VALUE="$(sanitize "${GOOGLE_IOS_CLIENT_ID:-}")"
        echo "Building $IMAGE ..."
        docker build \
          -t "$IMAGE" \
          -t $(fullMobileWebImageName):latest \
          --build-arg EXPO_PUBLIC_API_URL=$(backendApiUrl) \
          --build-arg EXPO_PUBLIC_SHOW_DEMO_LOGIN=true \
          --build-arg EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID_VALUE}" \
          --build-arg EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID="${GOOGLE_ANDROID_CLIENT_ID_VALUE}" \
          --build-arg EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID_VALUE}" \
          -f $(mobileWebDockerfilePath) $(mobileWebDockerContext)
        docker push "$IMAGE"
        docker push $(fullMobileWebImageName):latest
        echo "Pushed $IMAGE"
      displayName: 'Build and push mobile web image'
      env:
        DOCKER_BUILDKIT: '0'
        GOOGLE_WEB_CLIENT_ID: $(GOOGLE_WEB_CLIENT_ID)
        GOOGLE_ANDROID_CLIENT_ID: $(GOOGLE_ANDROID_CLIENT_ID)
        GOOGLE_IOS_CLIENT_ID: $(GOOGLE_IOS_CLIENT_ID)

    - script: |
        set -euo pipefail
        IMAGE="$(fullMobileWebImageName):$(imageTag)"
        TAG="$(imageTag)"
        REPO="$(mobileWebImageName)"
        USER="$(dockerRegistry)"
        echo "Verifying Docker Hub has $IMAGE ..."
        CODE=$(curl -s -o /tmp/hub-mobile-web-tag.json -w "%{http_code}" \
          "https://hub.docker.com/v2/repositories/${USER}/${REPO}/tags/${TAG}/")
        if [ "$CODE" != "200" ]; then
          echo "ERROR: Docker Hub returned HTTP $CODE for ${USER}/${REPO}:${TAG}"
          cat /tmp/hub-mobile-web-tag.json || true
          echo "Mobile web push did not land; refusing to continue to Deploy."
          exit 1
        fi
        echo "Confirmed on Docker Hub: $IMAGE"
      displayName: 'Verify mobile web tag on Docker Hub'

- stage: DeployMobileWeb
  displayName: 'Deploy mobile web to Kubernetes'
  dependsOn:
    - MobileWebImage
  condition: and(succeeded('MobileWebImage'), eq('${{ parameters.deployMobileWeb }}', true))
  jobs:
  - deployment: DeployMobileWeb
    displayName: 'Deploy mobile web'
    environment: 'production'
    pool:
      name: 'Default'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: 'Checkout mobile web manifests'

          - script: |
              set -euo pipefail
              HOST="$(mobileWebHost)"
              PORT="$(mobileWebNodePort)"
              NS="$(mobileWebNamespace)"
              echo "Checking ${HOST} and nodePort ${PORT} are not owned by another program..."

              kubectl get ingress -A -o go-template='{{range .items}}{{.metadata.namespace}}{{"\t"}}{{range .spec.rules}}{{.host}}{{" "}}{{end}}{{"\n"}}{{end}}' > /tmp/ingress-hosts.txt
              while IFS="$(printf '\t')" read -r ns hosts; do
                [ -n "${ns:-}" ] || continue
                for h in $hosts; do
                  if [ "$h" = "$HOST" ] && [ "$ns" != "$NS" ]; then
                    echo "ERROR: ${HOST} is already used by namespace ${ns}"
                    exit 1
                  fi
                done
              done < /tmp/ingress-hosts.txt

              kubectl get svc -A -o go-template='{{range .items}}{{.metadata.namespace}}{{"\t"}}{{.metadata.name}}{{"\t"}}{{range .spec.ports}}{{.nodePort}}{{" "}}{{end}}{{"\n"}}{{end}}' > /tmp/svc-ports.txt
              while IFS="$(printf '\t')" read -r ns name ports; do
                [ -n "${ns:-}" ] || continue
                for p in $ports; do
                  if [ "$p" = "$PORT" ] && [ "$ns" != "$NS" ]; then
                    echo "ERROR: nodePort ${PORT} is already used by ${ns}/${name}"
                    exit 1
                  fi
                done
              done < /tmp/svc-ports.txt

              echo "Host and nodePort are free (or already ours)."
            displayName: 'Refuse host or port owned by another app'

          - script: |
              set -euo pipefail
              kubectl create namespace $(mobileWebNamespace) --dry-run=client -o yaml | kubectl apply -f -
              sed -i "s|PLACEHOLDER_IMAGE_NAME:PLACEHOLDER_IMAGE_TAG|$(fullMobileWebImageName):$(imageTag)|g" mobile/k8s/deployment.yaml
              kubectl apply -f mobile/k8s/deployment.yaml
              kubectl apply -f mobile/k8s/service.yaml
              kubectl apply -f mobile/k8s/ingress.yaml
            displayName: 'Apply mobile web deployment, service, and ingress'

          - script: |
              set -euo pipefail
              kubectl apply -f backend/k8s/configmap.yaml
              kubectl rollout restart deployment/olive-lifecycle-api -n $(backendNamespace)
              kubectl rollout status deployment/olive-lifecycle-api -n $(backendNamespace) --timeout=600s
            displayName: 'Allow the mobile web origin on the API'

          - script: |
              set -euo pipefail
              if [ "$(id -u)" -eq 0 ]; then
                bash deploy/caddy/install.sh
              elif sudo -n true 2>/dev/null; then
                sudo bash deploy/caddy/install.sh
              else
                echo "WARNING: agent cannot reload Caddy (not root)."
                echo "HTTPS $(mobileWebBaseUrl) stays unpublished until someone runs: sudo bash deploy/caddy/install.sh"
                echo "NodePort remains at http://$(kubernetesNodeIp):$(mobileWebNodePort)"
                exit 0
              fi
            displayName: 'Install Caddy site for the mobile web host'

          - script: |
              set +e
              kubectl rollout status deployment/olive-lifecycle-mobile-web -n $(mobileWebNamespace) --timeout=600s
              status=$?
              if [ "$status" -ne 0 ]; then
                echo "=== Mobile web rollout did not finish ==="
                kubectl get pods -n $(mobileWebNamespace) -o wide
                kubectl describe deployment olive-lifecycle-mobile-web -n $(mobileWebNamespace)
                kubectl describe pods -n $(mobileWebNamespace) -l app=olive-lifecycle-mobile-web
                exit "$status"
              fi
              echo "Mobile web:  $(mobileWebBaseUrl)"
              echo "NodePort:    http://$(kubernetesNodeIp):$(mobileWebNodePort)"
            displayName: 'Wait for mobile web deployment rollout'

- stage: Deploy
  displayName: 'Deploy to Kubernetes'
  dependsOn:
    - Package
    - MobileBuild
    - FrontendImage
  condition: and(
      succeeded('Package'),
      in(dependencies.MobileBuild.result, 'Succeeded', 'Skipped'),
      or(
        and(eq('${{ parameters.deployFrontend }}', true), succeeded('FrontendImage')),
        and(eq('${{ parameters.deployFrontend }}', false), in(dependencies.FrontendImage.result, 'Succeeded', 'Skipped'))
      ),
      or(
        eq('${{ parameters.deployBackend }}', true),
        eq('${{ parameters.deployFrontend }}', true)
      )
    )
  jobs:
  - deployment: Deploy
    displayName: 'Deploy to Kubernetes'
    environment: 'production'
    pool:
      name: 'Default'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: 'Checkout source for Kubernetes manifests'

          - script: |
              kubectl create namespace $(backendNamespace) --dry-run=client -o yaml | kubectl apply -f -
              kubectl create namespace $(frontendNamespace) --dry-run=client -o yaml | kubectl apply -f -
            displayName: 'Ensure namespaces exist'

          # Production extra: one-time rename cleanup (deletes live deployments). Skip while iterating.
          # - script: |
          #     kubectl delete deployment backend-deployment ...
          #     ... free leftover agrotrack-* NodePorts ...
          #   displayName: 'Clean up legacy Kubernetes resource names'

          - script: 'kubectl apply -f backend/k8s/configmap.yaml'
            displayName: 'Apply backend ConfigMap'
            condition: eq('${{ parameters.deployBackend }}', true)

          - script: 'kubectl apply -f backend/k8s/pvc.yaml'
            displayName: 'Apply backend uploads PVC'
            condition: eq('${{ parameters.deployBackend }}', true)

          - task: Bash@3
            displayName: 'Wipe production MongoDB (OliveLifecycle)'
            condition: and(eq('${{ parameters.deployBackend }}', true), eq('${{ parameters.wipeProductionDatabase }}', true))
            inputs:
              targetType: 'inline'
              script: |
                set -euo pipefail
                if [ -z "${MONGODB_CONNECTION_STRING:-}" ]; then
                  echo "ERROR: MONGODB_CONNECTION_STRING is empty; cannot wipe database."
                  exit 1
                fi
                DB_NAME="OliveLifecycle"
                echo "Dropping MongoDB database '${DB_NAME}' (field-centric reseed on next API start)..."
                docker run --rm mongo:7 mongosh "${MONGODB_CONNECTION_STRING}" --quiet --eval "db.getSiblingDB('${DB_NAME}').dropDatabase()"
                echo "Database '${DB_NAME}' dropped."
            env:
              MONGODB_CONNECTION_STRING: $(MONGODB_CONNECTION_STRING)

          - task: Bash@3
            displayName: 'Create backend Kubernetes Secrets'
            condition: eq('${{ parameters.deployBackend }}', true)
            inputs:
              targetType: 'inline'
              script: |
                MISSING_VARS=()

                if [ -z "${MONGODB_CONNECTION_STRING:-}" ]; then
                  MISSING_VARS+=("MONGODB_CONNECTION_STRING")
                fi

                if [ -z "${JWT_SECRET_KEY:-}" ]; then
                  MISSING_VARS+=("JWT_SECRET_KEY")
                fi

                if [ ${#MISSING_VARS[@]} -gt 0 ]; then
                  echo "ERROR: The following required variables are not set or are empty:"
                  for var in "${MISSING_VARS[@]}"; do
                    echo "  - $var"
                  done
                  echo ""
                  echo "Please set these in Library variable group 'Agrotrack-Secrets'."
                  exit 1
                fi

                if ! echo "${MONGODB_CONNECTION_STRING}" | grep -q "mongodb"; then
                  echo "WARNING: MONGODB_CONNECTION_STRING may be malformed"
                fi

                # Blank a value that still looks like an unexpanded pipeline macro.
                # Do not compare against a macro token here: the preprocessor replaces
                # those before bash runs, and a real secret would be skipped.
                sanitize() {
                  local value="${1:-}"
                  case "$value" in
                    '$('*')')
                      value=
                      ;;
                  esac
                  printf '%s' "${value}"
                }
                FIRMS_MAP_KEY_VALUE="$(sanitize "${FIRMS_MAP_KEY:-}")"
                EMAIL_SMTP_PASSWORD_VALUE="$(sanitize "${EMAIL_SMTP_PASSWORD:-}")"
                GOOGLE_WEB_CLIENT_ID_VALUE="$(sanitize "${GOOGLE_WEB_CLIENT_ID:-}")"
                GOOGLE_ANDROID_CLIENT_ID_VALUE="$(sanitize "${GOOGLE_ANDROID_CLIENT_ID:-}")"
                GOOGLE_IOS_CLIENT_ID_VALUE="$(sanitize "${GOOGLE_IOS_CLIENT_ID:-}")"

                SECRET_ARGS=(
                  --from-literal=MongoDB__ConnectionString="${MONGODB_CONNECTION_STRING}"
                  --from-literal=JWT__SecretKey="${JWT_SECRET_KEY}"
                )
                if [ -n "${FIRMS_MAP_KEY_VALUE}" ]; then
                  SECRET_ARGS+=(--from-literal=Geospatial__Fires__MapKey="${FIRMS_MAP_KEY_VALUE}")
                fi
                if [ -n "${EMAIL_SMTP_PASSWORD_VALUE}" ]; then
                  SECRET_ARGS+=(--from-literal=Email__SmtpPassword="${EMAIL_SMTP_PASSWORD_VALUE}")
                fi
                if [ -n "${GOOGLE_WEB_CLIENT_ID_VALUE}" ]; then
                  SECRET_ARGS+=(--from-literal=Auth__Google__ClientId="${GOOGLE_WEB_CLIENT_ID_VALUE}")
                fi
                # Extra Google client IDs (Android / iOS) accepted as ID-token audiences.
                GOOGLE_EXTRA_IDS=()
                if [ -n "${GOOGLE_ANDROID_CLIENT_ID_VALUE}" ]; then
                  GOOGLE_EXTRA_IDS+=("${GOOGLE_ANDROID_CLIENT_ID_VALUE}")
                fi
                if [ -n "${GOOGLE_IOS_CLIENT_ID_VALUE}" ]; then
                  GOOGLE_EXTRA_IDS+=("${GOOGLE_IOS_CLIENT_ID_VALUE}")
                fi
                idx=0
                for cid in "${GOOGLE_EXTRA_IDS[@]}"; do
                  SECRET_ARGS+=(--from-literal="Auth__Google__ClientIds__${idx}=${cid}")
                  idx=$((idx + 1))
                done

                echo "Creating Kubernetes secret 'backend-secrets' from Library group 'Agrotrack-Secrets'..."
                kubectl create secret generic backend-secrets \
                  "${SECRET_ARGS[@]}" \
                  --namespace=$(backendNamespace) \
                  --dry-run=client -o yaml | kubectl apply -f -

                if kubectl get secret backend-secrets -n $(backendNamespace) > /dev/null 2>&1; then
                  echo "Backend secret 'backend-secrets' applied in namespace $(backendNamespace)."
                  kubectl get secret backend-secrets -n $(backendNamespace) \
                    -o go-template='keys:{{range $k, $v := .data}} {{$k}}{{end}}{{"\n"}}'
                else
                  echo "ERROR: Failed to create backend secret!"
                  exit 1
                fi
            env:
              MONGODB_CONNECTION_STRING: $(MONGODB_CONNECTION_STRING)
              JWT_SECRET_KEY: $(JWT_SECRET_KEY)
              FIRMS_MAP_KEY: $(FIRMS_MAP_KEY)
              EMAIL_SMTP_PASSWORD: $(EMAIL_SMTP_PASSWORD)
              GOOGLE_WEB_CLIENT_ID: $(GOOGLE_WEB_CLIENT_ID)
              GOOGLE_ANDROID_CLIENT_ID: $(GOOGLE_ANDROID_CLIENT_ID)
              GOOGLE_IOS_CLIENT_ID: $(GOOGLE_IOS_CLIENT_ID)

          - script: |
              sed -i "s|PLACEHOLDER_IMAGE_NAME:PLACEHOLDER_IMAGE_TAG|$(fullImageName):$(imageTag)|g" backend/k8s/deployment.yaml
              kubectl apply -f backend/k8s/deployment.yaml
            displayName: 'Apply/Update backend deployment'
            condition: eq('${{ parameters.deployBackend }}', true)

          - script: |
              sed -i "s|nodePort: [0-9]*|nodePort: $(backendNodePort)|" backend/k8s/service.yaml
              kubectl apply -f backend/k8s/service.yaml
            displayName: 'Apply backend service'
            condition: eq('${{ parameters.deployBackend }}', true)

          - task: Bash@3
            displayName: 'Update frontend ConfigMap with API URL'
            condition: eq('${{ parameters.deployFrontend }}', true)
            inputs:
              targetType: 'inline'
              script: |
                kubectl create configmap olive-lifecycle-frontend-config \
                  --from-literal=REACT_APP_API_URL="$(backendApiUrl)" \
                  --namespace=$(frontendNamespace) \
                  --dry-run=client -o yaml | kubectl apply -f -
                echo "ConfigMap updated with API URL: $(backendApiUrl)"

          - script: |
              sed -i "s|PLACEHOLDER_IMAGE_NAME:PLACEHOLDER_IMAGE_TAG|$(fullFrontendImageName):$(imageTag)|g" frontend/k8s/deployment.yaml
              kubectl apply -f frontend/k8s/deployment.yaml
            displayName: 'Apply/Update frontend deployment'
            condition: eq('${{ parameters.deployFrontend }}', true)

          - script: 'kubectl apply -f frontend/k8s/service.yaml'
            displayName: 'Apply frontend service'
            condition: eq('${{ parameters.deployFrontend }}', true)

          - script: 'kubectl apply -f frontend/k8s/ingress.yaml'
            displayName: 'Apply frontend ingress (control panel discovery)'
            condition: eq('${{ parameters.deployFrontend }}', true)

          - script: 'kubectl apply -f backend/k8s/ingress.yaml'
            displayName: 'Apply backend ingress (control panel discovery)'
            condition: eq('${{ parameters.deployBackend }}', true)

          # --- production extras (re-enable later) ---
          # Reload host Caddy /uploads route
          # Pre-rollout cluster diagnostics
          # Recover stuck deployment rollouts
          # Display pod logs

          - script: 'kubectl rollout status deployment/olive-lifecycle-api -n $(backendNamespace) --timeout=600s'
            displayName: 'Wait for backend deployment rollout'
            condition: eq('${{ parameters.deployBackend }}', true)
            continueOnError: true

          - script: |
              set +e
              kubectl rollout status deployment/olive-lifecycle-frontend -n $(frontendNamespace) --timeout=600s
              status=$?
              if [ "$status" -ne 0 ]; then
                echo "=== Frontend rollout did not finish ==="
                kubectl get pods -n $(frontendNamespace) -o wide
                kubectl describe deployment olive-lifecycle-frontend -n $(frontendNamespace)
                kubectl describe pods -n $(frontendNamespace) -l app=olive-lifecycle-frontend
                exit "$status"
              fi
            displayName: 'Wait for frontend deployment rollout'
            condition: eq('${{ parameters.deployFrontend }}', true)

          - script: |
              echo "=== Deployment Status ==="
              kubectl get pods -n $(backendNamespace) -l app=olive-lifecycle-api
              kubectl get pods -n $(frontendNamespace) -l app=olive-lifecycle-frontend
              kubectl get pods -n $(mobileWebNamespace) -l app=olive-lifecycle-mobile-web || true
              echo "Backend API:  $(backendApiUrl)"
              echo "Frontend:     $(frontendBaseUrl)"
              echo "Mobile web:   $(mobileWebBaseUrl)"
              echo "Mobile port:  http://$(kubernetesNodeIp):$(mobileWebNodePort)"
            displayName: 'Display deployment status and URLs'

