# Azure DevOps Build and Deploy Pipeline for Oleachron (Olive Lifecycle Platform)
# Builds Docker images, pushes to Docker Hub, deploys to Kubernetes.
# Mobile APK: built from mobile/ (Gradle on agent, no EAS), staged into frontend/public/downloads,
# then baked into the frontend Docker image for nginx to serve at /downloads/oleachron-alpha.apk.
# Maps use MapLibre Native + free Esri/OSM tiles (no Google API key).

trigger:
  - master
  - main

# Manual run (Pipelines → Run pipeline): check the boxes you want.
# CI on main uses these defaults — website + API, no APK.
parameters:
  - name: deployBackend
    displayName: 'Deploy backend (API)'
    type: boolean
    default: true

  - name: deployFrontend
    displayName: 'Deploy frontend (website)'
    type: boolean
    default: true

  - name: buildMobileApk
    displayName: 'Also build and publish Android APK to /downloads'
    type: boolean
    default: false

variables:
  # Library variable group (Pipelines → Library → Agrotrack-Secrets).
  # Must stay linked or DOCKER_*/JWT_*/MONGODB_* will be empty and docker login breaks.
  - group: Agrotrack-Secrets
  - name: solution
    value: 'backend/OliveLifecycle.sln'
  - name: buildConfiguration
    value: 'Release'
  - name: dockerRegistry
    value: '$(DOCKER_USERNAME)'
  - name: imageName
    value: 'oleachron-backend'
  - name: fullImageName
    value: '$(dockerRegistry)/$(imageName)'
  - name: imageTag
    value: '$(Build.BuildId)'
  - name: dockerfilePath
    value: 'backend/Dockerfile'
  - name: dockerContext
    value: 'backend'
  - name: backendNamespace
    value: 'oleachron-backend'
  - name: frontendNamespace
    value: 'oleachron-frontend'
  - name: backendNodePort
    value: '31847'
  - name: frontendNodePort
    value: '31848'
  - name: backendApiUrl
    value: 'https://api.oleachron.conceptatlas.eu'
  - name: frontendBaseUrl
    value: 'https://oleachron.conceptatlas.eu'
  - name: kubernetesNodeIp
    value: '185.193.66.50'
  - name: frontendImageName
    value: 'oleachron-frontend'
  - name: fullFrontendImageName
    value: '$(dockerRegistry)/$(frontendImageName)'
  - name: frontendDockerfilePath
    value: 'frontend/Dockerfile'
  - name: frontendDockerContext
    value: 'frontend'
  - name: apkFilename
    value: 'oleachron-alpha.apk'
  # Self-hosted agent has Docker but no buildx. Classic builder only.
  - name: DOCKER_BUILDKIT
    value: '0'

stages:
# Lean loop: Docker build + deploy only. Re-enable Build/HealthCheck for real production.
# - stage: Build
#   displayName: 'Build and Test'
#   ... UseDotNet, restore, build, test ...

- stage: Package
  displayName: 'Package Application'
  dependsOn: []
  jobs:
  - job: Package
    displayName: 'Create and Push Docker Images'
    pool:
      name: 'Default'
    steps:
    - script: |
        if [ -z "${DOCKER_USERNAME:-}" ] || [ -z "${DOCKER_PASSWORD:-}" ]; then
          echo "ERROR: DOCKER_USERNAME / DOCKER_PASSWORD are empty."
          echo "Link Library variable group 'Agrotrack-Secrets' to this pipeline (YAML: variables.group)."
          exit 1
        fi
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      displayName: 'Login to Docker Hub'
      env:
        DOCKER_USERNAME: $(DOCKER_USERNAME)
        DOCKER_PASSWORD: $(DOCKER_PASSWORD)

    - script: |
        docker build -t $(fullImageName):$(imageTag) -t $(fullImageName):latest -f $(dockerfilePath) $(dockerContext)
        docker push $(fullImageName):$(imageTag)
        docker push $(fullImageName):latest
      displayName: 'Build and push backend image'
      condition: eq('${{ parameters.deployBackend }}', true)
      env:
        DOCKER_BUILDKIT: '0'

    - script: |
        docker build \
          -t $(fullFrontendImageName):$(imageTag) \
          -t $(fullFrontendImageName):latest \
          --build-arg REACT_APP_API_URL=$(backendApiUrl) \
          --build-arg REACT_APP_SHOW_DEMO_LOGIN=true \
          -f $(frontendDockerfilePath) $(frontendDockerContext)
        docker push $(fullFrontendImageName):$(imageTag)
        docker push $(fullFrontendImageName):latest
      displayName: 'Build and push frontend image'
      condition: and(succeeded(), eq('${{ parameters.deployFrontend }}', true), ne('${{ parameters.buildMobileApk }}', true))
      env:
        DOCKER_BUILDKIT: '0'

- stage: MobileBuild
  displayName: 'Build Mobile APK (Gradle, no EAS)'
  dependsOn: []
  condition: and(succeeded(), eq('${{ parameters.buildMobileApk }}', true))
  jobs:
  - job: BuildMobile
    displayName: 'Build Android APK (Gradle on agent)'
    pool:
      name: 'Default'
    steps:
    - task: NodeTool@0
      displayName: 'Use Node.js 20'
      inputs:
        versionSpec: '20.x'

    - task: Cache@2
      displayName: 'Cache mobile npm packages'
      inputs:
        key: 'npm | "$(Agent.OS)" | mobile/package-lock.json'
        restoreKeys: |
          npm | "$(Agent.OS)"
        path: $(Build.SourcesDirectory)/mobile/node_modules

    - script: 'cd mobile && npm install --prefer-offline --no-audit --no-fund'
      displayName: 'Install mobile dependencies'

    - script: |
        # Do NOT re-run only part of this step — build + stage must run together.
        chmod +x mobile/scripts/setup-java.sh mobile/scripts/setup-android-sdk.sh \
          mobile/scripts/build-android-apk.sh mobile/scripts/build-and-stage-apk.sh
        source mobile/scripts/setup-java.sh
        echo "##vso[task.setvariable variable=JAVA_HOME]${JAVA_HOME}"
        mobile/scripts/build-and-stage-apk.sh
        test -f mobile/oleachron-mobile.apk
        test -f frontend/public/downloads/$(apkFilename)
      displayName: 'Build and stage APK for frontend /downloads'
      env:
        BACKEND_API_URL: $(backendApiUrl)
        BUILD_BUILDID: $(Build.BuildId)
        BUILD_ID: $(Build.BuildId)
        BUILD_SOURCESDIRECTORY: $(Build.SourcesDirectory)
        APK_FILENAME: $(apkFilename)
      continueOnError: false
      timeoutInMinutes: 90

    - script: |
        if [ -z "${DOCKER_USERNAME:-}" ] || [ -z "${DOCKER_PASSWORD:-}" ]; then
          echo "ERROR: DOCKER_USERNAME / DOCKER_PASSWORD are empty."
          echo "Link Library variable group 'Agrotrack-Secrets' to this pipeline (YAML: variables.group)."
          exit 1
        fi
        echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
      displayName: 'Login to Docker Hub for frontend rebuild'
      env:
        DOCKER_USERNAME: $(DOCKER_USERNAME)
        DOCKER_PASSWORD: $(DOCKER_PASSWORD)

    - script: |
        docker build \
          -t $(fullFrontendImageName):$(imageTag) \
          -t $(fullFrontendImageName):latest \
          --build-arg REACT_APP_API_URL=$(backendApiUrl) \
          --build-arg REACT_APP_SHOW_DEMO_LOGIN=true \
          -f $(frontendDockerfilePath) $(frontendDockerContext)
        docker push $(fullFrontendImageName):$(imageTag)
        docker push $(fullFrontendImageName):latest
      displayName: 'Rebuild and push frontend image with APK'
      env:
        DOCKER_BUILDKIT: '0'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish APK as artifact'
      condition: succeeded()
      inputs:
        pathToPublish: 'mobile/oleachron-mobile.apk'
        artifactName: 'mobile-apk'
        publishLocation: 'Container'

    - script: |
        echo "=== Mobile Build Summary ==="
        echo ""
        echo "APK built on agent (Gradle, no EAS)."
        echo ""
        echo "Latest:  /downloads/$(apkFilename)"
        echo "Manifest: /downloads/latest.json"
        echo "Landing page section: /#alpha-apk"
        echo ""
        echo "Azure DevOps artifact: Pipelines -> Latest run -> Artifacts -> mobile-apk"
        echo ""
        echo "The app connects to: $(backendApiUrl)"
      displayName: 'Display build summary'

- stage: Deploy
  displayName: 'Deploy to Kubernetes'
  dependsOn:
    - Package
    - MobileBuild
  condition: and(
      succeeded('Package'),
      in(dependencies.MobileBuild.result, 'Succeeded', 'Skipped'),
      or(
        eq('${{ parameters.deployBackend }}', true),
        eq('${{ parameters.deployFrontend }}', true)
      )
    )
  jobs:
  - deployment: Deploy
    displayName: 'Deploy to Kubernetes'
    environment: 'production'
    pool:
      name: 'Default'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            displayName: 'Checkout source for Kubernetes manifests'

          - script: |
              kubectl create namespace $(backendNamespace) --dry-run=client -o yaml | kubectl apply -f -
              kubectl create namespace $(frontendNamespace) --dry-run=client -o yaml | kubectl apply -f -
            displayName: 'Ensure namespaces exist'

          # Production extra: one-time rename cleanup (deletes live deployments). Skip while iterating.
          # - script: |
          #     kubectl delete deployment backend-deployment ...
          #     ... free leftover agrotrack-* NodePorts ...
          #   displayName: 'Clean up legacy Kubernetes resource names'

          - script: 'kubectl apply -f backend/k8s/configmap.yaml'
            displayName: 'Apply backend ConfigMap'
            condition: eq('${{ parameters.deployBackend }}', true)

          - script: 'kubectl apply -f backend/k8s/pvc.yaml'
            displayName: 'Apply backend uploads PVC'
            condition: eq('${{ parameters.deployBackend }}', true)

          - task: Bash@3
            displayName: 'Create backend Kubernetes Secrets'
            condition: eq('${{ parameters.deployBackend }}', true)
            inputs:
              targetType: 'inline'
              script: |
                MISSING_VARS=()

                if [ -z "${MONGODB_CONNECTION_STRING:-}" ]; then
                  MISSING_VARS+=("MONGODB_CONNECTION_STRING")
                fi

                if [ -z "${JWT_SECRET_KEY:-}" ]; then
                  MISSING_VARS+=("JWT_SECRET_KEY")
                fi

                if [ ${#MISSING_VARS[@]} -gt 0 ]; then
                  echo "ERROR: The following required variables are not set or are empty:"
                  for var in "${MISSING_VARS[@]}"; do
                    echo "  - $var"
                  done
                  echo ""
                  echo "Please set these in Library variable group 'Agrotrack-Secrets'."
                  exit 1
                fi

                if ! echo "${MONGODB_CONNECTION_STRING}" | grep -q "mongodb"; then
                  echo "WARNING: MONGODB_CONNECTION_STRING may be malformed"
                fi

                SECRET_ARGS=(
                  --from-literal=MongoDB__ConnectionString="${MONGODB_CONNECTION_STRING}"
                  --from-literal=JWT__SecretKey="${JWT_SECRET_KEY}"
                )
                if [ -n "${FIRMS_MAP_KEY:-}" ] && [ "${FIRMS_MAP_KEY}" != '$(FIRMS_MAP_KEY)' ]; then
                  SECRET_ARGS+=(--from-literal=Geospatial__Fires__MapKey="${FIRMS_MAP_KEY}")
                fi

                echo "Creating Kubernetes secret 'backend-secrets' from Library group 'Agrotrack-Secrets'..."
                kubectl create secret generic backend-secrets \
                  "${SECRET_ARGS[@]}" \
                  --namespace=$(backendNamespace) \
                  --dry-run=client -o yaml | kubectl apply -f -

                if kubectl get secret backend-secrets -n $(backendNamespace) > /dev/null 2>&1; then
                  echo "Backend secret 'backend-secrets' applied in namespace $(backendNamespace)."
                  kubectl get secret backend-secrets -n $(backendNamespace) \
                    -o go-template='keys:{{range $k, $v := .data}} {{$k}}{{end}}{{"\n"}}'
                else
                  echo "ERROR: Failed to create backend secret!"
                  exit 1
                fi
            env:
              MONGODB_CONNECTION_STRING: $(MONGODB_CONNECTION_STRING)
              JWT_SECRET_KEY: $(JWT_SECRET_KEY)
              FIRMS_MAP_KEY: $(FIRMS_MAP_KEY)

          - script: |
              sed -i "s|PLACEHOLDER_IMAGE_NAME:PLACEHOLDER_IMAGE_TAG|$(fullImageName):$(imageTag)|g" backend/k8s/deployment.yaml
              kubectl apply -f backend/k8s/deployment.yaml
            displayName: 'Apply/Update backend deployment'
            condition: eq('${{ parameters.deployBackend }}', true)

          - script: |
              sed -i "s|nodePort: [0-9]*|nodePort: $(backendNodePort)|" backend/k8s/service.yaml
              kubectl apply -f backend/k8s/service.yaml
            displayName: 'Apply backend service'
            condition: eq('${{ parameters.deployBackend }}', true)

          - task: Bash@3
            displayName: 'Update frontend ConfigMap with API URL'
            condition: eq('${{ parameters.deployFrontend }}', true)
            inputs:
              targetType: 'inline'
              script: |
                kubectl create configmap olive-lifecycle-frontend-config \
                  --from-literal=REACT_APP_API_URL="$(backendApiUrl)" \
                  --namespace=$(frontendNamespace) \
                  --dry-run=client -o yaml | kubectl apply -f -
                echo "ConfigMap updated with API URL: $(backendApiUrl)"

          - script: |
              sed -i "s|PLACEHOLDER_IMAGE_NAME:PLACEHOLDER_IMAGE_TAG|$(fullFrontendImageName):$(imageTag)|g" frontend/k8s/deployment.yaml
              kubectl apply -f frontend/k8s/deployment.yaml
            displayName: 'Apply/Update frontend deployment'
            condition: eq('${{ parameters.deployFrontend }}', true)

          - script: 'kubectl apply -f frontend/k8s/service.yaml'
            displayName: 'Apply frontend service'
            condition: eq('${{ parameters.deployFrontend }}', true)

          - script: 'kubectl apply -f frontend/k8s/ingress.yaml'
            displayName: 'Apply frontend ingress (control panel discovery)'
            condition: eq('${{ parameters.deployFrontend }}', true)

          - script: 'kubectl apply -f backend/k8s/ingress.yaml'
            displayName: 'Apply backend ingress (control panel discovery)'
            condition: eq('${{ parameters.deployBackend }}', true)

          # --- production extras (re-enable later) ---
          # Reload host Caddy /uploads route
          # Pre-rollout cluster diagnostics
          # Recover stuck deployment rollouts
          # Display pod logs

          - script: 'kubectl rollout status deployment/olive-lifecycle-api -n $(backendNamespace) --timeout=600s'
            displayName: 'Wait for backend deployment rollout'
            condition: eq('${{ parameters.deployBackend }}', true)
            continueOnError: true

          - script: 'kubectl rollout status deployment/olive-lifecycle-frontend -n $(frontendNamespace) --timeout=300s'
            displayName: 'Wait for frontend deployment rollout'
            condition: eq('${{ parameters.deployFrontend }}', true)
            continueOnError: true

          - script: |
              echo "=== Deployment Status ==="
              kubectl get pods -n $(backendNamespace) -l app=olive-lifecycle-api
              kubectl get pods -n $(frontendNamespace) -l app=olive-lifecycle-frontend
              echo "Backend API:  $(backendApiUrl)"
              echo "Frontend:     $(frontendBaseUrl)"
            displayName: 'Display deployment status and URLs'

# Health Check stage disabled while iterating. Re-enable for real production.
# - stage: HealthCheck
#   displayName: 'Health Check'
#   dependsOn: Deploy
#   ... kubectl gets, curl /health, APK download check ...
