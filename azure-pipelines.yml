# Azure DevOps Build and Deploy Pipeline for AgroTrack (Olive Lifecycle Platform)
# Builds Docker images, pushes to Docker Hub, and deploys to Kubernetes
# Optional mobile APK build attaches to frontend at /downloads/olivecycle-alpha.apk

trigger:
  - master
  - main

parameters:
  - name: buildMobileApk
    displayName: 'Build Android APK and attach to landing page /downloads'
    type: boolean
    default: true

  - name: deployBackend
    displayName: 'Deploy backend to Kubernetes'
    type: boolean
    default: true

  - name: deployFrontend
    displayName: 'Deploy frontend to Kubernetes'
    type: boolean
    default: true

variables:
  - group: AgroTrack-Secrets
  - name: solution
    value: 'backend/OliveLifecycle.sln'
  - name: buildConfiguration
    value: 'Release'
  - name: dockerRegistry
    value: '$(DOCKER_USERNAME)'
  - name: imageName
    value: 'agrotrack-backend'
  - name: fullImageName
    value: '$(dockerRegistry)/$(imageName)'
  - name: imageTag
    value: '$(Build.BuildId)'
  - name: dockerfilePath
    value: 'backend/Dockerfile'
  - name: dockerContext
    value: 'backend'
  - name: backendNamespace
    value: 'agrotrack-backend'
  - name: frontendNamespace
    value: 'agrotrack-frontend'
  - name: backendNodePort
    value: '31847'
  - name: backendApiUrl
    value: 'http://185.193.66.50:31847'
  - name: kubernetesNodeIp
    value: '185.193.66.50'
  - name: frontendImageName
    value: 'agrotrack-frontend'
  - name: fullFrontendImageName
    value: '$(dockerRegistry)/$(frontendImageName)'
  - name: frontendDockerfilePath
    value: 'frontend/Dockerfile'
  - name: frontendDockerContext
    value: 'frontend'
  - name: apkFilename
    value: 'olivecycle-alpha.apk'

stages:
- stage: Build
  displayName: 'Build and Test'
  jobs:
  - job: Build
    displayName: 'Build Application'
    pool:
      name: 'Default'
    steps:
    - task: UseDotNet@2
      displayName: 'Install .NET 8.0 SDK'
      inputs:
        packageType: 'sdk'
        version: '8.0.x'
        includePreviewVersions: false

    - script: 'dotnet restore $(solution)'
      displayName: 'Restore NuGet packages'

    - script: 'dotnet build $(solution) --configuration $(buildConfiguration) --no-restore'
      displayName: 'Build solution'

    - script: 'dotnet test $(solution) --configuration $(buildConfiguration) --no-build --verbosity normal'
      displayName: 'Run tests'
      continueOnError: true

- stage: Package
  displayName: 'Package Application'
  dependsOn: Build
  jobs:
  - job: Package
    displayName: 'Create and Push Docker Images'
    pool:
      name: 'Default'
    steps:
    - script: 'echo "$(DOCKER_PASSWORD)" | docker login -u "$(DOCKER_USERNAME)" --password-stdin'
      displayName: 'Login to Docker Hub'
      env:
        DOCKER_USERNAME: $(DOCKER_USERNAME)
        DOCKER_PASSWORD: $(DOCKER_PASSWORD)

    - script: 'docker build -t $(fullImageName):$(imageTag) -t $(fullImageName):latest -f $(dockerfilePath) $(dockerContext)'
      displayName: 'Build backend Docker image'

    - script: 'docker push $(fullImageName):$(imageTag)'
      displayName: 'Push backend Docker image with tag'

    - script: 'docker push $(fullImageName):latest'
      displayName: 'Push backend Docker image as latest'

    - script: 'docker images | grep $(imageName)'
      displayName: 'List backend Docker images'

    - script: |
        docker build \
          -t $(fullFrontendImageName):$(imageTag) \
          -t $(fullFrontendImageName):latest \
          --build-arg REACT_APP_API_URL=$(backendApiUrl) \
          --build-arg REACT_APP_SHOW_DEMO_LOGIN=true \
          -f $(frontendDockerfilePath) $(frontendDockerContext)
      displayName: 'Build frontend Docker image'
      condition: ne('${{ parameters.buildMobileApk }}', true)

    - script: 'docker push $(fullFrontendImageName):$(imageTag)'
      displayName: 'Push frontend Docker image with tag'
      condition: ne('${{ parameters.buildMobileApk }}', true)

    - script: 'docker push $(fullFrontendImageName):latest'
      displayName: 'Push frontend Docker image as latest'
      condition: ne('${{ parameters.buildMobileApk }}', true)

- stage: MobileBuild
  displayName: 'Build Mobile APK'
  dependsOn: Package
  condition: and(succeeded(), eq('${{ parameters.buildMobileApk }}', true))
  jobs:
  - job: BuildMobile
    displayName: 'Build Android APK with EAS'
    pool:
      name: 'Default'
    steps:
    - task: NodeTool@0
      displayName: 'Install Node.js'
      inputs:
        versionSpec: '20.x'

    - script: 'npm install -g eas-cli@20.4.0'
      displayName: 'Install EAS CLI'

    - script: |
        if [ -z "${EXPO_TOKEN:-}" ]; then
          echo "ERROR: EXPO_TOKEN is not set!"
          echo ""
          echo "Please add EXPO_TOKEN to the AgroTrack-Secrets variable group:"
          echo "  1. Go to Azure DevOps -> Pipelines -> Library"
          echo "  2. Open AgroTrack-Secrets variable group"
          echo "  3. Add variable: EXPO_TOKEN (mark as secret)"
          echo "  4. Get token from: https://expo.dev/accounts/[username]/settings/access-tokens"
          exit 1
        fi
        echo "EXPO_TOKEN is set (length: ${#EXPO_TOKEN} characters)"
      displayName: 'Verify EXPO_TOKEN is set'
      env:
        EXPO_TOKEN: $(EXPO_TOKEN)

    - script: 'cd mobile && npm install'
      displayName: 'Install mobile dependencies'

    - script: |
        cd mobile
        echo "Verifying EAS project is configured..."
        if [ -f "eas.json" ]; then
          echo "eas.json found"
        else
          echo "WARNING: eas.json not found - project may not be initialized"
        fi

        EXPO_USERNAME=$(eas whoami 2>/dev/null | head -1 || echo "")
        if [ -n "$EXPO_USERNAME" ]; then
          echo "Authenticated as: $EXPO_USERNAME"
        else
          echo "Could not verify authentication"
        fi
      displayName: 'Verify EAS Project Configuration'
      env:
        EXPO_TOKEN: $(EXPO_TOKEN)
      continueOnError: true

    - script: |
        set -euo pipefail
        cd mobile
        echo "Starting EAS build for Android APK..."
        echo "Build profile: production"
        echo "API URL: $(backendApiUrl)"
        echo ""
        echo "This will start a cloud build. It may take 10-20 minutes."

        export NODE_ENV=production
        export EAS_BUILD_NO_EXPO_GO_WARNING=true

        if ! EXPO_PUBLIC_API_URL="$(backendApiUrl)" \
          EXPO_PUBLIC_SHOW_DEMO_LOGIN="true" \
          eas build --platform android --profile production --non-interactive --wait --json > eas-build-output.json 2>eas-build-stderr.log; then
          echo "EAS CLI exited with an error. Last lines of stderr:"
          tail -80 eas-build-stderr.log || true
          echo ""
          echo "Last lines of stdout:"
          tail -40 eas-build-output.json || true
          exit 1
        fi

        node <<'NODE'
        const fs = require('fs');
        const raw = fs.readFileSync('eas-build-output.json', 'utf8').trim();
        const jsonStart = raw.search(/[\[{]/);
        if (jsonStart < 0) {
          console.error('ERROR: No JSON found in EAS build output');
          console.error(raw.slice(0, 800));
          process.exit(1);
        }
        let parsed;
        try {
          parsed = JSON.parse(raw.slice(jsonStart));
        } catch (error) {
          console.error('ERROR: Failed to parse EAS JSON output');
          console.error(raw.slice(jsonStart, jsonStart + 800));
          process.exit(1);
        }
        const build = Array.isArray(parsed) ? parsed[0] : parsed;
        if (!build?.id) {
          console.error('ERROR: Could not read build id from EAS output');
          console.error(raw.slice(0, 800));
          process.exit(1);
        }
        const status = String(build.status || '').toUpperCase();
        if (status !== 'FINISHED') {
          console.error(`ERROR: Build finished with status ${build.status}`);
          if (build.error?.message) {
            console.error(`EAS error: ${build.error.message}`);
          }
          process.exit(1);
        }
        const artifactUrl =
          build.artifacts?.buildUrl ||
          build.artifacts?.applicationArchiveUrl ||
          null;
        fs.writeFileSync('eas-build-id.txt', build.id);
        if (artifactUrl) {
          fs.writeFileSync('eas-artifact-url.txt', artifactUrl);
        }
        console.log(`Build ID: ${build.id}`);
        console.log(`Build status: ${build.status}`);
        NODE

        if [ -f eas-artifact-url.txt ]; then
          echo "Downloading APK from EAS artifact URL..."
          curl -fsSL "$(cat eas-artifact-url.txt)" -o ./agrotrack-mobile.apk
        else
          echo "Artifact URL not in build output; using eas build:download --build-id..."
          BUILD_ID="$(cat eas-build-id.txt)"
          eas build:download --build-id "$BUILD_ID" --non-interactive
          APK_FILE="$(find . -maxdepth 1 -name '*.apk' -type f | head -1)"
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: eas build:download did not produce an APK file"
            exit 1
          fi
          mv "$APK_FILE" ./agrotrack-mobile.apk
        fi

        if [ ! -f "./agrotrack-mobile.apk" ]; then
          echo "ERROR: APK file not found after download"
          exit 1
        fi

        APK_SIZE=$(du -h ./agrotrack-mobile.apk | cut -f1)
        echo "APK downloaded successfully! Size: $APK_SIZE"
        ls -lh ./agrotrack-mobile.apk
      displayName: 'Build and download Android APK with EAS'
      env:
        EXPO_TOKEN: $(EXPO_TOKEN)
      continueOnError: false
      timeoutInMinutes: 45

    - script: |
        set -euo pipefail
        node <<'NODE'
        const fs = require('fs');
        const path = require('path');
        const dir = path.join('frontend', 'public', 'downloads');
        fs.mkdirSync(dir, { recursive: true });
        fs.copyFileSync(
          path.join('mobile', 'agrotrack-mobile.apk'),
          path.join(dir, process.env.APK_FILENAME),
        );
        const manifest = {
          available: true,
          buildId: process.env.BUILD_ID,
          builtAt: new Date().toISOString(),
          filename: process.env.APK_FILENAME,
          url: `/downloads/${process.env.APK_FILENAME}`,
        };
        fs.writeFileSync(path.join(dir, 'latest.json'), `${JSON.stringify(manifest, null, 2)}\n`);
        console.log('Landing page download manifest:');
        console.log(JSON.stringify(manifest, null, 2));
        NODE
      displayName: 'Stage APK for landing page download'
      env:
        BUILD_ID: $(Build.BuildId)
        APK_FILENAME: $(apkFilename)

    - script: 'echo "$(DOCKER_PASSWORD)" | docker login -u "$(DOCKER_USERNAME)" --password-stdin'
      displayName: 'Login to Docker Hub for frontend rebuild'
      env:
        DOCKER_USERNAME: $(DOCKER_USERNAME)
        DOCKER_PASSWORD: $(DOCKER_PASSWORD)

    - script: |
        docker build \
          -t $(fullFrontendImageName):$(imageTag) \
          -t $(fullFrontendImageName):latest \
          --build-arg REACT_APP_API_URL=$(backendApiUrl) \
          --build-arg REACT_APP_SHOW_DEMO_LOGIN=true \
          -f $(frontendDockerfilePath) $(frontendDockerContext)
      displayName: 'Rebuild frontend image with APK'

    - script: 'docker push $(fullFrontendImageName):$(imageTag)'
      displayName: 'Push frontend image with APK'

    - script: 'docker push $(fullFrontendImageName):latest'
      displayName: 'Push frontend latest with APK'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish APK as artifact'
      inputs:
        pathToPublish: 'mobile/agrotrack-mobile.apk'
        artifactName: 'mobile-apk'
        publishLocation: 'Container'

    - script: |
        echo "=== Mobile Build Summary ==="
        echo ""
        echo "APK built successfully!"
        echo ""
        echo "Public download path: /downloads/$(apkFilename)"
        echo "Landing page section: /#alpha-apk"
        echo ""
        echo "Azure DevOps artifact: Pipelines -> Latest run -> Artifacts -> mobile-apk"
        echo ""
        echo "The app connects to: $(backendApiUrl)"
      displayName: 'Display build summary'

- stage: Deploy
  displayName: 'Deploy to Kubernetes'
  dependsOn:
    - Package
    - MobileBuild
  condition: and(
      succeeded('Package'),
      in(dependencies.MobileBuild.result, 'Succeeded', 'Skipped'),
      or(
        eq('${{ parameters.deployBackend }}', true),
        eq('${{ parameters.deployFrontend }}', true)
      )
    )
  jobs:
  - deployment: Deploy
    displayName: 'Deploy to Kubernetes'
    environment: 'production'
    pool:
      name: 'Default'
    strategy:
      runOnce:
        deploy:
          steps:
          - script: |
              kubectl create namespace $(backendNamespace) --dry-run=client -o yaml | kubectl apply -f -
              kubectl create namespace $(frontendNamespace) --dry-run=client -o yaml | kubectl apply -f -
            displayName: 'Ensure namespaces exist'

          - script: |
              echo "Removing legacy deployment and service names..."
              kubectl delete deployment backend-deployment -n $(backendNamespace) --ignore-not-found=true
              kubectl delete deployment frontend-deployment -n $(frontendNamespace) --ignore-not-found=true
              kubectl delete service backend-service -n $(backendNamespace) --ignore-not-found=true
              kubectl delete service frontend-service -n $(frontendNamespace) --ignore-not-found=true
              kubectl delete configmap backend-config -n $(backendNamespace) --ignore-not-found=true
              kubectl delete configmap frontend-config -n $(frontendNamespace) --ignore-not-found=true
            displayName: 'Clean up legacy Kubernetes resource names'
            continueOnError: true

          - script: 'kubectl apply -f backend/k8s/namespace.yaml'
            displayName: 'Apply backend namespace configuration'
            condition: eq('${{ parameters.deployBackend }}', true)

          - script: 'kubectl apply -f backend/k8s/configmap.yaml'
            displayName: 'Apply backend ConfigMap'
            condition: eq('${{ parameters.deployBackend }}', true)

          - task: Bash@3
            displayName: 'Create backend Kubernetes Secrets'
            condition: eq('${{ parameters.deployBackend }}', true)
            inputs:
              targetType: 'inline'
              script: |
                MISSING_VARS=()

                if [ -z "${MONGODB_CONNECTION_STRING:-}" ]; then
                  MISSING_VARS+=("MONGODB_CONNECTION_STRING")
                fi

                if [ -z "${JWT_SECRET_KEY:-}" ]; then
                  MISSING_VARS+=("JWT_SECRET_KEY")
                fi

                if [ ${#MISSING_VARS[@]} -gt 0 ]; then
                  echo "ERROR: The following required variables are not set or are empty:"
                  for var in "${MISSING_VARS[@]}"; do
                    echo "  - $var"
                  done
                  echo ""
                  echo "Please set these in the AgroTrack-Secrets variable group."
                  exit 1
                fi

                if ! echo "${MONGODB_CONNECTION_STRING}" | grep -q "mongodb"; then
                  echo "WARNING: MONGODB_CONNECTION_STRING may be malformed"
                fi

                kubectl create secret generic backend-secrets \
                  --from-literal=MongoDB__ConnectionString="${MONGODB_CONNECTION_STRING}" \
                  --from-literal=JWT__SecretKey="${JWT_SECRET_KEY}" \
                  --namespace=$(backendNamespace) \
                  --dry-run=client -o yaml | kubectl apply -f -

                if kubectl get secret backend-secrets -n $(backendNamespace) > /dev/null 2>&1; then
                  echo "Backend secret created successfully."
                else
                  echo "ERROR: Failed to create backend secret!"
                  exit 1
                fi
            env:
              MONGODB_CONNECTION_STRING: $(MONGODB_CONNECTION_STRING)
              JWT_SECRET_KEY: $(JWT_SECRET_KEY)

          - script: |
              sed -i "s|PLACEHOLDER_IMAGE_NAME:PLACEHOLDER_IMAGE_TAG|$(fullImageName):$(imageTag)|g" backend/k8s/deployment.yaml
              kubectl apply -f backend/k8s/deployment.yaml
            displayName: 'Apply/Update backend deployment'
            condition: eq('${{ parameters.deployBackend }}', true)

          - script: |
              echo "Recreating backend service as NodePort $(backendNodePort)..."
              kubectl delete service olive-lifecycle-api-service -n $(backendNamespace) --ignore-not-found=true
              sed -i "s|nodePort: [0-9]*|nodePort: $(backendNodePort)|" backend/k8s/service.yaml
              kubectl apply -f backend/k8s/service.yaml
            displayName: 'Apply backend service'
            condition: eq('${{ parameters.deployBackend }}', true)

          - script: 'kubectl apply -f frontend/k8s/namespace.yaml'
            displayName: 'Apply frontend namespace configuration'
            condition: eq('${{ parameters.deployFrontend }}', true)

          - task: Bash@3
            displayName: 'Update frontend ConfigMap with API URL'
            condition: eq('${{ parameters.deployFrontend }}', true)
            inputs:
              targetType: 'inline'
              script: |
                kubectl create configmap olive-lifecycle-frontend-config \
                  --from-literal=REACT_APP_API_URL="$(backendApiUrl)" \
                  --namespace=$(frontendNamespace) \
                  --dry-run=client -o yaml | kubectl apply -f -
                echo "ConfigMap updated with API URL: $(backendApiUrl)"

          - script: 'kubectl apply -f frontend/k8s/configmap.yaml'
            displayName: 'Apply frontend ConfigMap'
            condition: eq('${{ parameters.deployFrontend }}', true)
            continueOnError: true

          - script: |
              sed -i "s|PLACEHOLDER_IMAGE_NAME:PLACEHOLDER_IMAGE_TAG|$(fullFrontendImageName):$(imageTag)|g" frontend/k8s/deployment.yaml
              kubectl apply -f frontend/k8s/deployment.yaml
            displayName: 'Apply/Update frontend deployment'
            condition: eq('${{ parameters.deployFrontend }}', true)

          - script: 'kubectl apply -f frontend/k8s/service.yaml'
            displayName: 'Apply frontend service'
            condition: eq('${{ parameters.deployFrontend }}', true)

          - script: |
              set -euo pipefail
              echo "=== Backend deployment (before rollout) ==="
              kubectl get deployment olive-lifecycle-api -n $(backendNamespace) -o wide || true
              kubectl get pods -n $(backendNamespace) -o wide || true
              echo ""
              echo "=== Frontend deployment (before rollout) ==="
              kubectl get deployment olive-lifecycle-frontend -n $(frontendNamespace) -o wide || true
              kubectl get pods -n $(frontendNamespace) -o wide || true
            displayName: 'Pre-rollout cluster diagnostics'
            continueOnError: true

          - script: 'kubectl rollout status deployment/olive-lifecycle-api -n $(backendNamespace) --timeout=600s'
            displayName: 'Wait for backend deployment rollout'
            condition: eq('${{ parameters.deployBackend }}', true)
            continueOnError: true

          - script: 'kubectl rollout status deployment/olive-lifecycle-frontend -n $(frontendNamespace) --timeout=300s'
            displayName: 'Wait for frontend deployment rollout'
            condition: eq('${{ parameters.deployFrontend }}', true)
            continueOnError: true

          - script: |
              set -euo pipefail
              echo "=== Post-rollout recovery (if controller lagged) ==="
              BACKEND_GEN=$(kubectl get deployment olive-lifecycle-api -n $(backendNamespace) -o jsonpath='{.metadata.generation}' 2>/dev/null || echo "")
              BACKEND_OBS=$(kubectl get deployment olive-lifecycle-api -n $(backendNamespace) -o jsonpath='{.status.observedGeneration}' 2>/dev/null || echo "")
              FRONTEND_GEN=$(kubectl get deployment olive-lifecycle-frontend -n $(frontendNamespace) -o jsonpath='{.metadata.generation}' 2>/dev/null || echo "")
              FRONTEND_OBS=$(kubectl get deployment olive-lifecycle-frontend -n $(frontendNamespace) -o jsonpath='{.status.observedGeneration}' 2>/dev/null || echo "")

              if [ -n "$BACKEND_GEN" ] && [ "$BACKEND_GEN" != "$BACKEND_OBS" ]; then
                echo "Backend observedGeneration lagging; forcing rollout restart..."
                kubectl rollout restart deployment/olive-lifecycle-api -n $(backendNamespace)
                kubectl rollout status deployment/olive-lifecycle-api -n $(backendNamespace) --timeout=600s || true
              fi

              if [ -n "$FRONTEND_GEN" ] && [ "$FRONTEND_GEN" != "$FRONTEND_OBS" ]; then
                echo "Frontend observedGeneration lagging; forcing rollout restart..."
                kubectl rollout restart deployment/olive-lifecycle-frontend -n $(frontendNamespace)
                kubectl rollout status deployment/olive-lifecycle-frontend -n $(frontendNamespace) --timeout=300s || true
              fi
            displayName: 'Recover stuck deployment rollouts'
            continueOnError: true

          - script: |
              echo "=== Deployment Status ==="
              echo ""
              kubectl get deployment olive-lifecycle-api -n $(backendNamespace)
              kubectl get deployment olive-lifecycle-frontend -n $(frontendNamespace)
              echo ""
              kubectl get pods -n $(backendNamespace) -l app=olive-lifecycle-api
              kubectl get pods -n $(frontendNamespace) -l app=olive-lifecycle-frontend
              echo ""
              kubectl get service olive-lifecycle-api-service -n $(backendNamespace)
              kubectl get service olive-lifecycle-frontend-service -n $(frontendNamespace)
              echo ""
              NODE_PORT=$(kubectl get service olive-lifecycle-frontend-service -n $(frontendNamespace) -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo "")
              echo "Backend API:  http://$(kubernetesNodeIp):$(backendNodePort)"
              if [ -n "$NODE_PORT" ]; then
                echo "Frontend:     http://$(kubernetesNodeIp):$NODE_PORT"
                echo "APK download: http://$(kubernetesNodeIp):$NODE_PORT/downloads/$(apkFilename)"
              fi
            displayName: 'Display deployment status and URLs'

          - script: |
              echo "=== Pod Logs (last 20 lines) ==="
              for NS in $(backendNamespace) $(frontendNamespace); do
                PODS=$(kubectl get pods -n "$NS" -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo "")
                for POD in $PODS; do
                  echo "--- Logs from $POD ($NS) ---"
                  kubectl logs "$POD" -n "$NS" --tail=20 || true
                done
              done
            displayName: 'Display pod logs'
            continueOnError: true

- stage: HealthCheck
  displayName: 'Health Check'
  dependsOn: Deploy
  condition: succeeded()
  jobs:
  - job: HealthCheck
    displayName: 'Verify Deployment Health'
    pool:
      name: 'Default'
    steps:
    - script: |
        kubectl get pods -n $(backendNamespace)
        kubectl get pods -n $(frontendNamespace)
      displayName: 'List all pods'

    - script: |
        kubectl get services -n $(backendNamespace)
        kubectl get services -n $(frontendNamespace)
      displayName: 'List all services'

    - script: |
        kubectl get deployments -n $(backendNamespace)
        kubectl get deployments -n $(frontendNamespace)
      displayName: 'Check deployment status'

    - script: |
        echo "Testing backend health endpoint..."
        echo "Health URL: http://$(kubernetesNodeIp):$(backendNodePort)/health"
        curl -f http://$(kubernetesNodeIp):$(backendNodePort)/health || echo "Backend health check failed, but continuing..."
      displayName: 'Check Backend Health'
      condition: eq('${{ parameters.deployBackend }}', true)
      continueOnError: true

    - script: |
        NODE_PORT=$(kubectl get service olive-lifecycle-frontend-service -n $(frontendNamespace) -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo "")
        if [ -z "$NODE_PORT" ]; then
          echo "Could not determine frontend NodePort"
          exit 0
        fi
        FRONTEND_URL="http://$(kubernetesNodeIp):$NODE_PORT"
        echo "Testing frontend health endpoint..."
        curl -f "$FRONTEND_URL/health" || echo "Frontend health check failed, but continuing..."
      displayName: 'Check Frontend Health'
      condition: eq('${{ parameters.deployFrontend }}', true)
      continueOnError: true

    - script: |
        NODE_PORT=$(kubectl get service olive-lifecycle-frontend-service -n $(frontendNamespace) -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo "")
        if [ -z "$NODE_PORT" ]; then
          echo "Could not determine frontend NodePort"
          exit 0
        fi
        FRONTEND_URL="http://$(kubernetesNodeIp):$NODE_PORT"
        echo "Checking landing page APK download wiring..."
        echo "Manifest: $FRONTEND_URL/downloads/latest.json"
        curl -sf "$FRONTEND_URL/downloads/latest.json" || { echo "WARNING: latest.json not reachable"; exit 0; }
        echo ""
        echo "APK HEAD: $FRONTEND_URL/downloads/$(apkFilename)"
        curl -sfI "$FRONTEND_URL/downloads/$(apkFilename)" | head -5 || echo "WARNING: APK not reachable yet"
      displayName: 'Check APK on landing page'
      condition: eq('${{ parameters.buildMobileApk }}', true)
      continueOnError: true

    - script: |
        NODE_PORT=$(kubectl get service olive-lifecycle-frontend-service -n $(frontendNamespace) -o jsonpath='{.spec.ports[0].nodePort}' 2>/dev/null || echo "")
        echo "=== Deployment Summary ==="
        echo "Backend API:  http://$(kubernetesNodeIp):$(backendNodePort)"
        echo "EXPO_PUBLIC_API_URL=$(backendApiUrl)"
        if [ -n "$NODE_PORT" ]; then
          echo "Frontend:     http://$(kubernetesNodeIp):$NODE_PORT"
          echo "APK download: http://$(kubernetesNodeIp):$NODE_PORT/downloads/$(apkFilename)"
        fi
        kubectl get svc -n $(backendNamespace)
        kubectl get svc -n $(frontendNamespace)
      displayName: 'Display deployment URLs'
