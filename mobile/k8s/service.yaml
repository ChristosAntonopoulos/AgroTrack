apiVersion: v1
kind: Service
metadata:
  name: olive-lifecycle-mobile-web-service
  namespace: oleachron-mobile
  labels:
    app: olive-lifecycle-mobile-web
    app.kubernetes.io/part-of: oleachron
  annotations:
    external-dns.alpha.kubernetes.io/hostname: theolivelot-mobile.conceptatlas.eu
spec:
  type: NodePort
  selector:
    app: olive-lifecycle-mobile-web
  ports:
  - port: 80
    targetPort: 80
    nodePort: 31849
    protocol: TCP
    name: http
